<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite — Galería de plantillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Bricolage+Grotesque:wght@500;700&family=Space+Grotesk:wght@500;700&family=Fredoka:wght@500;600&family=Baloo+2:wght@600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --radius-s:10px; --radius-m:18px; --radius-l:28px;
  --font-mono:'Space Mono', monospace; /* firma técnica constante de la plataforma */
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:#0d0d0d; font-family:'Inter',sans-serif; color:#eee; min-height:100vh;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* ================= THEMES ================= */
[data-theme="boda"]{
  --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
  --ink:#122019; --ink-2:#1c2f26; --paper:#F7F1E4; --paper-2:#EFE6D2;
  --accent:#B98B3E; --accent-2:#5C2333; --muted:#7C8C74;
  --on-ink:#F7F1E4; --on-paper:#1B2A24; --hair:rgba(185,139,62,.35);
}
[data-theme="xv"]{
  --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif;
  --ink:#241221; --ink-2:#33162d; --paper:#FBF0E9; --paper-2:#F5E3D6;
  --accent:#C98A4B; --accent-2:#9B3B52; --muted:#C98A4B;
  --on-ink:#FBF0E9; --on-paper:#2B141F; --hair:rgba(155,59,82,.35);
}
[data-theme="cumple"]{
  --font-display:'Bricolage Grotesque', sans-serif; --font-body:'Inter', sans-serif;
  --ink:#0F2E28; --ink-2:#173F37; --paper:#FBEEDD; --paper-2:#F4DFC0;
  --accent:#E0A458; --accent-2:#D1495B; --muted:#2E6F63;
  --on-ink:#FBEEDD; --on-paper:#12211D; --hair:rgba(224,164,88,.35);
}
[data-theme="ejecutivo"]{
  --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif;
  --ink:#10151F; --ink-2:#1A2230; --paper:#F2F1ED; --paper-2:#E6E4DC;
  --accent:#3D6E64; --accent-2:#8A6E4B; --muted:#6B7280;
  --on-ink:#F2F1ED; --on-paper:#14181F; --hair:rgba(61,110,100,.35);
}
[data-theme="bautismo"]{
  --font-display:'Cormorant Garamond', serif; --font-body:'Inter', sans-serif;
  --ink:#445C63; --ink-2:#587179; --paper:#FBF7F0; --paper-2:#F1E9DA;
  --accent:#C9A66B; --accent-2:#7E9C8E; --muted:#B7C9C2;
  --on-ink:#FBF7F0; --on-paper:#33454A; --hair:rgba(201,166,107,.4);
}
[data-theme="nacimiento"]{
  --font-display:'Fredoka', sans-serif; --font-body:'Inter', sans-serif;
  --ink:#56624C; --ink-2:#6C7A60; --paper:#FBF3EA; --paper-2:#F3E4D3;
  --accent:#E3A57C; --accent-2:#7C8F6E; --muted:#C9B79C;
  --on-ink:#FBF3EA; --on-paper:#37402F; --hair:rgba(227,165,124,.4);
}
[data-theme="infantil"]{
  --font-display:'Baloo 2', sans-serif; --font-body:'Inter', sans-serif;
  --ink:#1E1B4B; --ink-2:#2C2870; --paper:#FFF8E7; --paper-2:#FCEBC4;
  --accent:#FF6B6B; --accent-2:#2EC4B6; --muted:#FFC845;
  --on-ink:#FFF8E7; --on-paper:#221E4B; --hair:rgba(46,196,182,.35);
}

/* ============ App chrome (demo shell, no forma parte del entregable) ============ */
.app-shell{max-width:1320px; margin:0 auto; padding:20px 16px 64px;}
.controls{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:22px;
  padding:12px 14px; background:#161616; border:1px solid #2a2a2a; border-radius:16px;
}
.label-mini{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#777; margin-right:6px;}
.chip{
  font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:8px 14px;
  border-radius:999px; border:1px solid #333; background:#000; color:#aaa; cursor:pointer; transition:all .2s ease;
}
.chip.active{background:#fff; color:#000; border-color:#fff;}
.stage{display:flex; justify-content:center;}

.phone{width:390px; max-width:100%; background:#000; border-radius:44px; padding:14px; box-shadow:0 30px 60px rgba(0,0,0,.5);}
.phone-notch{height:22px; display:flex; align-items:center; justify-content:center;}
.phone-notch::before{content:''; width:110px; height:16px; background:#000; border-radius:12px;}
.phone-screen{height:800px; overflow-y:auto; border-radius:30px; background:var(--paper); scrollbar-width:none; position:relative;}
.phone-screen::-webkit-scrollbar{display:none;}

/* ============ TEMPLATE (compartido por todos los temas) ============ */
.tpl{color:var(--on-paper); font-family:var(--font-body);}
.hero{
  position:relative; min-height:520px; display:flex; flex-direction:column; justify-content:flex-end;
  padding:28px 26px 34px;
  background:linear-gradient(180deg, rgba(0,0,0,.1) 0%, rgba(0,0,0,.55) 100%), radial-gradient(120% 90% at 30% 15%, var(--ink-2), var(--ink) 70%);
  color:var(--on-ink); overflow:hidden;
}
.seal{
  width:60px; height:60px; border-radius:50%; border:1.5px solid var(--accent);
  display:flex; align-items:center; justify-content:center; margin-bottom:20px;
  animation:sealIn 900ms cubic-bezier(.2,.8,.2,1) both;
}
.seal span{font-family:var(--font-display); font-size:18px; color:var(--accent); font-weight:600;}
@keyframes sealIn{0%{transform:scale(.4) rotate(-14deg); opacity:0;} 100%{transform:scale(1) rotate(0); opacity:1;}}
.eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 10px;}
.hero h1{font-family:var(--font-display); font-weight:700; font-size:40px; line-height:1.06; margin:0 0 14px;}
.hero h1 em{font-style:italic; font-weight:500; color:var(--accent);}
.hero p.date{font-family:var(--font-mono); font-size:12.5px; color:var(--on-ink); opacity:.82; margin:0;}
.scroll-cue{position:absolute; bottom:14px; left:50%; transform:translateX(-50%); width:1px; height:26px; background:var(--accent); opacity:.6;}

.section{padding:38px 26px; border-bottom:1px solid var(--hair);}
.section.dark{background:var(--ink); color:var(--on-ink);}
.kicker{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-2); margin:0 0 8px; display:flex; align-items:center; gap:8px;}
.kicker::before{content:''; width:18px; height:1px; background:var(--accent-2);}
.section.dark .kicker{color:var(--accent);}
.section.dark .kicker::before{background:var(--accent);}
h2{font-family:var(--font-display); font-weight:700; font-size:24px; margin:0 0 12px;}

.countdown{display:flex; gap:10px; margin-top:16px;}
.cd-box{flex:1; background:var(--paper-2); border-radius:var(--radius-s); text-align:center; padding:12px 4px;}
.section.dark .cd-box{background:rgba(255,255,255,.07);}
.cd-num{font-family:var(--font-mono); font-weight:700; font-size:20px; display:block;}
.cd-label{font-size:9px; text-transform:uppercase; letter-spacing:.07em; opacity:.62;}

.quote{font-family:var(--font-display); font-style:italic; font-size:18px; line-height:1.5; margin:0;}

.detail-card{background:var(--paper-2); border-radius:var(--radius-m); padding:17px; margin-bottom:12px;}
.detail-card h3{font-family:var(--font-display); font-weight:700; font-size:17px; margin:0 0 4px;}
.detail-card p{margin:0 0 12px; font-size:13px; line-height:1.5; opacity:.85;}
.btn{display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:12.5px; padding:9px 16px; border-radius:999px; border:1px solid var(--on-paper); color:var(--on-paper); background:transparent; cursor:pointer; text-decoration:none;}
.btn.solid{background:var(--accent-2); color:var(--on-ink); border-color:var(--accent-2);}

.field{margin-bottom:12px;}
.field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; opacity:.6; margin-bottom:6px;}
.field input{width:100%; padding:12px 14px; border-radius:var(--radius-s); border:1px solid rgba(0,0,0,.15); background:var(--paper); font-size:14px; color:var(--on-paper); font-family:var(--font-body);}
.stepper{display:flex; align-items:center; gap:14px;}
.stepper button{width:32px; height:32px; border-radius:50%; border:1px solid var(--on-paper); background:transparent; font-size:15px; cursor:pointer;}
.stepper .n{font-family:var(--font-mono); font-weight:700; font-size:15px; min-width:18px; text-align:center;}

.info-card{border-radius:var(--radius-m); padding:16px 18px; margin-top:16px; display:flex; gap:12px; align-items:flex-start;}
.info-card.tone-a{background:rgba(0,0,0,.05); border:1px dashed var(--accent);}
.section.dark .info-card.tone-a{background:rgba(255,255,255,.08);}
.info-card .dot{width:8px; height:8px; border-radius:50%; margin-top:5px; flex-shrink:0; background:var(--accent);}
.info-card p{margin:0; font-size:13px; line-height:1.5;}
.info-card strong{display:block; font-size:13.5px; margin-bottom:2px;}

.mod-input-row{display:flex; gap:8px; margin-top:14px;}
.mod-input-row input{flex:1;}
.mod-list{margin-top:16px; display:flex; flex-direction:column; gap:8px;}
.mod-item{display:flex; align-items:center; justify-content:space-between; background:var(--paper-2); border-radius:var(--radius-s); padding:11px 14px;}
.section.dark .mod-item{background:rgba(255,255,255,.07);}
.mod-item .meta{font-size:13px;}
.mod-item .meta b{display:block; font-size:13.5px;}
.mod-item .meta span{opacity:.62; font-size:11.5px;}
.badge{display:flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:12px; background:none; border:1px solid var(--accent-2); color:var(--accent-2); border-radius:999px; padding:5px 10px; cursor:pointer; flex-shrink:0;}
.section.dark .badge{border-color:var(--accent); color:var(--accent);}
.badge.static{cursor:default;}

footer.tpl-footer{padding:28px 26px 38px; text-align:center; background:var(--ink); color:var(--on-ink);}
footer.tpl-footer .monogram{font-family:var(--font-display); font-weight:700; font-size:20px; color:var(--accent); margin-bottom:6px;}
footer.tpl-footer small{font-size:11px; opacity:.55;}

/* ---- botonera fija: MISMA en las 7 plantillas ---- */
.bottom-nav{
  position:sticky; bottom:10px; margin:0 16px;
  display:flex; justify-content:space-around;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(6px);
  border-radius:999px; padding:10px 6px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.bottom-nav a{color:var(--on-ink); opacity:.68; text-decoration:none; font-size:9.5px; text-transform:uppercase; letter-spacing:.03em; display:flex; flex-direction:column; align-items:center; gap:4px;}
.bottom-nav a b{font-size:15px; opacity:1;}

@media (max-width:820px){ .stage{flex-direction:column; align-items:center;} }
</style>
</head>

  <div class="stage">
    <div class="phone">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="tpl">

          <section class="hero">
            <div class="seal"><span id="monogram"></span></div>

            <p class="date" id="hero-date"></p>

          <section class="section">

            <h2 id="cd-title"></h2>

          </section>

          <section class="section dark">
            <p class="kicker" id="quote-kicker"></p>
            <p class="quote" id="quote-text"></p>
          </section>

          <section class="section">
            <p class="kicker" id="details-kicker"></p>
            <h2 id="details-title"></h2>
            <div class="detail-card">
              <h3 id="d1-title"></h3>
              <p id="d1-sub"></p>
              <a class="btn" href="#">Ver mapa ↗</a>
            </div>
            <div class="detail-card">
              <h3 id="d2-title"></h3>
              <p id="d2-sub"></p>
              <a class="btn" href="#">Ver mapa ↗</a>
            </div>
          </section>

          <section class="section dark">
            <p class="kicker" id="rsvp-kicker"></p>
            <h2 id="rsvp-title"></h2>
            <div class="field">
              <label>Nombre y apellido</label>
              <input type="text" id="rsvp-name-val">
            </div>
            <div class="field">
              <label id="rsvp-count-label">¿Cuántos asisten?</label>
              <div class="stepper">
                <button aria-label="Restar">–</button>
                <span class="n" id="rsvp-count">3</span>
                <button aria-label="Sumar">+</button>
              </div>
            </div>
            <div class="field">
              <label id="rsvp-note-label">Restricción alimentaria (opcional)</label>
              <input type="text" placeholder="Ej: vegetariano, celíaco...">
            </div>
            <button class="btn solid" style="width:100%; justify-content:center; padding:13px;" id="rsvp-btn"></button>

            <div class="info-card tone-a" id="moduleA-wrap">
              <div class="dot"></div>
              <p><strong id="moduleA-title"></strong><span id="moduleA-body"></span></p>
            </div>
          </section>

          <section class="section" id="moduleB-wrap">
            <p class="kicker" id="moduleB-kicker"></p>
            <h2 id="moduleB-title"></h2>
            <p style="font-size:13.5px; opacity:.75; margin:0 0 6px;" id="moduleB-sub"></p>
            <div class="mod-input-row" id="moduleB-input-row">
              <input type="text" id="moduleB-input" placeholder="">
              <button class="btn solid" id="moduleB-send">Enviar</button>
            </div>
            <div class="mod-list" id="moduleB-list"></div>
          </section>

          <footer class="tpl-footer">
            <div class="monogram" id="footer-monogram"></div>
            <small id="footer-text"></small>
          </footer>

          <div class="bottom-nav" id="bottom-nav"></div>

        </div>
      </div>
    </div>
  </div>
</div>

function render(key){
  const t = THEMES[key];
  document.body.setAttribute('data-theme', key);
  document.getElementById('monogram').textContent = t.monogram;
  document.getElementById('eyebrow-text').textContent = t.eyebrow;
  document.getElementById('hero-title').innerHTML = t.title;
  document.getElementById('hero-date').textContent = t.date;
  document.getElementById('cd-kicker').textContent = t.cdKicker;
  document.getElementById('cd-title').textContent = t.cdTitle;
  document.getElementById('cd-boxes').innerHTML = t.cdBoxes.map(b=>
    `<div class="cd-box"><span class="cd-num">${b.n}</span><span class="cd-label">${b.l}</span></div>`).join('');
  document.getElementById('quote-kicker').textContent = t.quoteKicker;
  document.getElementById('quote-text').textContent = t.quote;
  document.getElementById('details-kicker').textContent = t.detailsKicker;
  document.getElementById('details-title').textContent = t.detailsTitle;
  document.getElementById('d1-title').textContent = t.d1.t;
  document.getElementById('d1-sub').textContent = t.d1.s;
  document.getElementById('d2-title').textContent = t.d2.t;
  document.getElementById('d2-sub').textContent = t.d2.s;
  document.getElementById('rsvp-kicker').textContent = t.rsvpKicker;
  document.getElementById('rsvp-title').textContent = t.rsvpTitle;
  document.getElementById('rsvp-name-val').value = t.rsvpName;
  document.getElementById('rsvp-btn').textContent = t.rsvpBtn;
  document.getElementById('rsvp-count').textContent = '3';

  document.getElementById('moduleA-title').textContent = t.moduleA.title;
  document.getElementById('moduleA-body').textContent = ' ' + t.moduleA.body;

  document.getElementById('moduleB-kicker').textContent = t.moduleB.kicker;
  document.getElementById('moduleB-title').textContent = t.moduleB.title;
  const subEl = document.getElementById('moduleB-sub');
  subEl.textContent = t.moduleB.sub || '';
  subEl.style.display = t.moduleB.sub ? 'block' : 'none';
  document.getElementById('moduleB-input-row').style.display = t.moduleB.interactive ? 'flex' : 'none';
  document.getElementById('moduleB-input').placeholder = t.moduleB.placeholder || '';
  document.getElementById('moduleB-list').innerHTML = t.moduleB.items.map(it=>
    `<div class="mod-item"><div class="meta"><b>${it.t}</b><span>${it.s}</span></div><button class="badge ${t.moduleB.interactive ? '' : 'static'}">${it.badge}</button></div>`).join('');

  document.getElementById('footer-monogram').textContent = t.footerMono;
  document.getElementById('footer-text').textContent = t.footerText;
  document.getElementById('bottom-nav').innerHTML = t.nav.map(n=>
    `<a href="#"><b>${n.i}</b>${n.l}</a>`).join('');

  // re-attach vote handlers
  document.querySelectorAll('.badge:not(.static)').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const m = btn.textContent.match(/(\D*)(\d+)/);
      if(m){ btn.textContent = m[1] + (parseInt(m[2]) + 1); }
    });
  });

  document.getElementById('phone-screen-el') && (document.getElementById('phone-screen-el').scrollTop = 0);
}

document.querySelectorAll('[data-theme-btn]').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('[data-theme-btn]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    render(b.dataset.themeBtn);
    document.querySelector('.phone-screen').scrollTop = 0;
  });
});

render('boda');
</script>
